<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unfiltered - Próximamente</title>

  <!-- Bootstrap & Google Fonts (Inter) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <!-- CDN Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #141414; /* Identidad: Acid Black */
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 0.5rem;
    }

    p {
      color: #7A7A7A; /* Identidad: Industrial Gray */
      font-size: 1.1rem;
      max-width: 450px;
      margin-bottom: 2rem;
      font-weight: 500;
    }

    /* Cuenta atrás */
    .countdown-minimal {
      margin-bottom: 2.5rem;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: #ffffff;
    }

    /* Formulario Brutalista */
    .waitlist-container {
      width: 100%;
      max-width: 400px;
      margin-bottom: 2rem;
    }

    .unfiltered-input {
      background: transparent;
      border: 2px solid #7A7A7A;
      color: #fff;
      padding: 0.75rem 1rem;
      font-weight: 600;
      border-radius: 0 !important; /* Esquinas rectas estrictas */
      width: 100%;
      margin-bottom: 1rem;
      transition: border-color 0.2s ease;
    }

    .unfiltered-input:focus {
      outline: none;
      border-color: #ffffff;
      background: transparent;
      color: #fff;
      box-shadow: none;
    }

    .unfiltered-input::placeholder {
      color: #7A7A7A;
    }

    .unfiltered-btn {
      background: #ffffff;
      color: #141414;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0 !important;
      width: 100%;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .unfiltered-btn:hover {
      background: #7A7A7A;
      color: #ffffff;
    }

    /* Mensaje de respuesta */
    .response-box {
      font-weight: 500;
      border: 1px dashed #7A7A7A;
      padding: 1rem;
      font-size: 0.95rem;
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 1.5rem 0;
    }

    footer a {
      color: #7A7A7A;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #fff;
    }

    .social-icons a {
      margin: 0 0.75rem;
      color: #7A7A7A;
      transition: color 0.3s ease;
    }

    .social-icons a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <main>
    <h1>Unfiltered.</h1>
    <p>El club urbano de conexión auténtica en Barcelona. Únete a la lista para estar informado antes que nadie. ;)</p>

    <!-- Cuenta atrás -->
    <div class="countdown-minimal">
      <div id="countdown"></div>
    </div>

    <!-- Formulario de Registro Unificado -->
    <div class="waitlist-container">
      <form id="waitlist-form">
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="Tu correo electrónico" 
          class="unfiltered-input"
        >
        <input 
          type="text" 
          id="instagram" 
          placeholder="@usuario (Instagram / TikTok - Opcional)" 
          class="unfiltered-input"
        >
        <button type="submit" id="submit-btn" class="unfiltered-btn">Unirse al Club</button>
      </form>

      <!-- Caja de respuesta dinámica -->
      <div id="response-msg" class="response-box d-none"></div>
    </div>
   
  </main>

  <footer>
    <div class="social-icons mb-3">
      <a href="https://www.instagram.com/unfiltered_co/" target="_blank" rel="noopener">
        <i class="bi bi-instagram" style="font-size: 1.3rem;"></i>
      </a>
      <a href="https://www.tiktok.com/@unfiltered_co" target="_blank" rel="noopener">
        <i class="bi bi-tiktok" style="font-size: 1.3rem;"></i>
      </a>
    </div>
    <a href="/privacy.html">Privacy Policy</a>
  </footer>

  <script>
    // Configuración de Producción de Supabase
    const SUPABASE_URL = "https://hurfmwyrqizuwoxrnofk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_N5impqCmwTB5gkc82Yy27g_e9yVfFwN"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('waitlist-form');
    const submitBtn = document.getElementById('submit-btn');
    const responseMsg = document.getElementById('response-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const emailValue = document.getElementById('email').value.trim();
      const instagramValue = document.getElementById('instagram').value.trim();

      // 1. Control de Rate Limiting (Evitar spam idéntico al de Loops)
      var time = new Date();
      var timestamp = time.valueOf();
      var previousTimestamp = localStorage.getItem("loops-form-timestamp");

      if (previousTimestamp && Number(previousTimestamp) + 60000 > timestamp) {
        responseMsg.classList.remove('d-none');
        responseMsg.style.color = "#ff4444";
        responseMsg.style.borderColor = "#ff4444";
        responseMsg.innerHTML = "Demasiados intentos seguidos. Inténtalo de nuevo en un minuto.";
        return;
      }
      localStorage.setItem("loops-form-timestamp", timestamp);

      // Estado de carga brutalista
      submitBtn.innerText = "PROCESANDO...";
      submitBtn.disabled = true;

      // 2. Ejecutar inserción atómica en Supabase
      const { error: supabaseError } = await supabaseClient
        .from('waitlist')
        .insert([{ email: emailValue, instagram_handle: instagramValue }]);

      if (supabaseError) {
        form.classList.add('d-none');
        responseMsg.classList.remove('d-none');
        
        if (supabaseError.code === '23505') { 
          responseMsg.style.color = "#7A7A7A";
          responseMsg.style.borderColor = "#7A7A7A";
          responseMsg.innerHTML = "Este correo ya está registrado en la lista. Ya formas parte del club.";
        } else {
          responseMsg.style.color = "#ff4444";
          responseMsg.style.borderColor = "#ff4444";
          responseMsg.innerHTML = "Error de infraestructura. Inténtalo de nuevo.";
          submitBtn.innerText = "UNIRSE AL CLUB";
          submitBtn.disabled = false;
        }
        return; 
      }

      // 3. Si Supabase responde OK, disparamos los datos en segundo plano a Loops para el envío del mail
      // Nota: Mapeamos el campo de instagram en la propiedad 'userGroup' o similar si lo requieres, 
      // pero por defecto pasamos el email de forma estricta según su API formal.
      var loopsBody = "userGroup=" + encodeURIComponent(instagramValue) + "&mailingLists=&email=" + encodeURIComponent(emailValue);

      fetch("https://app.loops.so/api/newsletter-form/cmr3nzr9n03p70j30rmfww0yu", {
        method: "POST",
        body: loopsBody,
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
      })
      .then((res) => {
        // Renderizar pantalla de éxito sin importar si la analítica de Loops tarda un milisegundo más
        form.classList.add('d-none');
        responseMsg.classList.remove('d-none');
        responseMsg.style.color = "#ffffff";
        responseMsg.style.borderColor = "#ffffff";
        responseMsg.innerHTML = "Estás dentro del círculo.";
      })
      .catch((err) => {
        console.error("Sincronización de marketing secundaria omitida:", err);
        // Mostramos el éxito igualmente porque el dato ya está seguro en Supabase
        form.classList.add('d-none');
        responseMsg.classList.remove('d-none');
        responseMsg.style.color = "#ffffff";
        responseMsg.style.borderColor = "#ffffff";
        responseMsg.innerHTML = "Estás dentro del círculo. Manténlo real.";
      });
    });

    /* Lógica interna de la Cuenta Atrás (1 de Agosto de 2026) */
    const launchDate = new Date("2026-08-01T18:00:00+02:00").getTime();
    const countdownEl = document.getElementById("countdown");

    const timer = setInterval(function() {
      const now = new Date().getTime();
      const distance = launchDate - now;

      if (distance < 0) {
        clearInterval(timer);
        countdownEl.innerText = "LIVE";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / 1000 / 60) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      countdownEl.innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000);
  </script>

</body>
</html>
